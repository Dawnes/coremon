# Builds, signs and publishes a Coremon release when a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The signing key lives only in the "release" environment's secret
# COREMON_SIGNING_KEY. Protect that environment with a required reviewer so
# nothing is signed without your approval.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Build, test, sign, package
        env:
          COREMON_SIGNING_KEY: ${{ secrets.COREMON_SIGNING_KEY }}
          COREMON_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag must be vX.Y.Z"; exit 1; }
          VERSION="$VERSION" sh ./build.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/coremon-$VERSION.tar.gz" dist/install-master.sh dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Coremon $VERSION" --generate-notes
